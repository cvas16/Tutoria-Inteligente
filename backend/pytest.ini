[pytest]
asyncio_mode = auto

# Directorio raíz y búsqueda de pruebas
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Añadir el backend al PYTHONPATH para resolver 'from app... import ...'
pythonpath = .

# Opciones por defecto al invocar 'pytest'
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Registro de marcadores personalizados
markers =
    unit: Pruebas unitarias de schemas, features y reglas pedagógicas
    api: Pruebas sobre endpoints REST con AsyncClient
    integration: Pruebas de integración con PostgreSQL y flujo E2E del modelo predictivo

# Filtros para ignorar advertencias de librerías de ML
filterwarnings =
    ignore::DeprecationWarning:shap.*
    ignore::FutureWarning:lightgbm.*
    ignore::UserWarning:sklearn.*